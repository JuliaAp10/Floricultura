<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floricultura Anastacia</title>
    <style>
        body{
         background:rgb(97, 8, 70);
         color:rgb(245, 246, 244);
         font-family: Verdana, Geneva, Tahoma, sans-serif;
         text-align: center;
         margin: 0;
        }
        .perfil{
            width: 180px;
            height: 180px;
            margin: 50px;
            object-fit: cover;
            border: 5px solid pink;;
            border-radius: 50%;
            align-items: center;
        }
        .fotos {
            display: flex;
            gap: 30px;
            justify-content: center;
            padding: 10px 30px;
        }

        .fotos img {
            width: 30%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <header>
    <h1 style="font-family: comic sans Ms;font-size: 48px;">Floricultura Anastácia
    <hr>
    <img src="Floricultura.png" alt="Foto da Julia" class="perfil">
    <hr>
    <div class="fotos">
    <img src="Girassol.png" alt="Buquê de girassois">
    <img src="Rosas.png" alt="Buquê de rosas">
    <img src="Margaridas.png" alt="Buquê de margaridas">
</div>
</body>
</html>
