<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floricultura Anastacia</title>
    <style>
        body{
            background: rgb(9, 62, 62);
            color: rgb(253, 250, 252);
            font-family: Verdana;
            text-align: center;
            margin: 0;
        }
        .foto{
            width:180px;    
            height:180px;
            margin-top:60px auto;
            object-fit: cover;
            border: 6px solid rosybrown;
            border-radius: 80%;
            align-items: center;
        }
        .imagem{
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }
        .imagem img{
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
  </style>
    </head>
<body>
    <header>
        <h1 style="font-family: comic sans Ms; font-size: 48px;">Floricultura Anastácia
        </h1>
    </header>
    <hr>
    <img src="Floricultura.png" alt="floricultura img" class="foto">
    <hr>
    <div class="imagem">
    <img src="Girassol.png" alt="girassol">
    <img src="Rosas.png" alt="rosas">
    <img src="Margaridas.png" alt="margarida">
</div>
</body>
</html>
